name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag against project version
        id: validate-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) or tag != f"v{version}":
              raise SystemExit("Release tag must match v<project.version>.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"major_tag=v{version.split('.')[0]}", file=output)
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --generate-notes --verify-tag
      - name: Move the major version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          MAJOR_TAG: ${{ steps.validate-tag.outputs.major_tag }}
        run: |
          MAJOR_REF="tags/${MAJOR_TAG}"
          TAG_REF="refs/${MAJOR_REF}"
          if gh api "repos/${RELEASE_REPOSITORY}/git/ref/${MAJOR_REF}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${RELEASE_REPOSITORY}/git/refs/${MAJOR_REF}" \
              -f sha="$RELEASE_SHA" -F force=true
          else
            gh api --method POST "repos/${RELEASE_REPOSITORY}/git/refs" \
              -f ref="$TAG_REF" -f sha="$RELEASE_SHA"
          fi
