name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/sync_agent_skills.py --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  release:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        id: validate-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(v[0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag format" >&2
            exit 1
          fi
          echo "major_tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --generate-notes --verify-tag
      - name: Move the major version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          MAJOR_TAG: ${{ steps.validate-tag.outputs.major_tag }}
        run: |
          MAJOR_REF="tags/${MAJOR_TAG}"
          TAG_REF="refs/${MAJOR_REF}"
          if gh api "repos/${RELEASE_REPOSITORY}/git/ref/${MAJOR_REF}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${RELEASE_REPOSITORY}/git/refs/${MAJOR_REF}" \
              -f sha="$RELEASE_SHA" -F force=true
          else
            gh api --method POST "repos/${RELEASE_REPOSITORY}/git/refs" \
              -f ref="$TAG_REF" -f sha="$RELEASE_SHA"
          fi
