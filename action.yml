name: SlopGuard PyPI Dependency Check
description: Check pull-request Python dependencies for missing and look-alike PyPI packages.
author: Ahmad Builds
branding:
  icon: shield
  color: orange
inputs:
  config:
    description: Optional repository-relative SlopGuard TOML configuration path.
    required: false
    default: ""
  report-path:
    description: Where to write the JSON scan report.
    required: false
    default: ""
  python-version:
    description: Python version used to run SlopGuard.
    required: false
    default: "3.11"
  fail-on-block:
    description: Return a failing status when the scan decision is block.
    required: false
    default: "true"
  comment:
    description: Opt in to creating or updating SlopGuard's sticky pull-request comment.
    required: false
    default: "false"
  github-token:
    description: Token used only when comment is true; fork pull requests are skipped.
    required: false
    default: ${{ github.token }}
outputs:
  decision:
    description: Overall scan decision (pass, warn, or block).
    value: ${{ steps.scan.outputs.decision }}
  blocked:
    description: New dependencies with a block decision, one per line.
    value: ${{ steps.scan.outputs.blocked }}
  warned:
    description: New dependencies with a warn decision, one per line.
    value: ${{ steps.scan.outputs.warned }}
  report-path:
    description: Path to the generated JSON scan report.
    value: ${{ steps.scan.outputs.report-path }}
runs:
  using: composite
  steps:
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock
        python-version: ${{ inputs.python-version }}
    - name: Scan pull request dependencies
      id: scan
      shell: bash
      env:
        SLOPGUARD_CONFIG: ${{ inputs.config }}
        SLOPGUARD_REPORT_PATH: ${{ inputs.report-path }}
        SLOPGUARD_FAIL_ON_BLOCK: ${{ inputs.fail-on-block }}
        SLOPGUARD_COMMENT: ${{ inputs.comment }}
        # Expose the token to the scan step only when the opt-in comment is enabled.
        GITHUB_TOKEN: ${{ inputs.comment == 'true' && inputs.github-token || '' }}
        GITHUB_API_URL: ${{ github.api_url }}
        SLOPGUARD_RUNNER_TEMP: ${{ runner.temp }}
      run: |
        if [[ -z "$SLOPGUARD_REPORT_PATH" ]]; then
          SLOPGUARD_REPORT_PATH="$SLOPGUARD_RUNNER_TEMP/slopguard-report.json"
        fi
        args=(scan --repo "$GITHUB_WORKSPACE" --report "$SLOPGUARD_REPORT_PATH")
        if [[ -n "$SLOPGUARD_CONFIG" ]]; then
          args+=(--config "$SLOPGUARD_CONFIG")
        fi
        if [[ "$SLOPGUARD_FAIL_ON_BLOCK" != "true" ]]; then
          args+=(--no-fail-on-block)
        fi
        if [[ "$SLOPGUARD_COMMENT" == "true" ]]; then
          args+=(--comment auto)
        fi
        uv run --no-config --project "$GITHUB_ACTION_PATH" --locked --no-dev slopguard "${args[@]}"
