[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slopguard"
version = "1.0.0"
description = "A GitHub Action that detects suspicious Python dependencies before they merge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["packaging>=23.2,<27"]
keywords = ["dependency-security", "pypi", "typosquatting", "github-action"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/ahmadbuilds/SlopGuard"
Repository = "https://github.com/ahmadbuilds/SlopGuard"
Issues = "https://github.com/ahmadbuilds/SlopGuard/issues"

[project.scripts]
slopguard = "slopguard.cli:main"

[dependency-groups]
dev = [
    "jsonschema==4.23.0",
    "pre-commit==4.7.0",
    "PyYAML==6.0.4",
    "pytest==9.2.0",
    "ruff==0.17.6",
]
eval = [
    "scikit-learn==1.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["evals", "evals.*"]

[tool.setuptools.package-data]
slopguard = ["py.typed", "schemas/*.json", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = [".", "src", "scripts"]
markers = ["slow: performance-sensitive check"]
