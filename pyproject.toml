[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slopguard"
version = "0.1.0"
description = "A Python-only PyPI package risk scanner MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["packaging>=23.2,<27"]

[project.optional-dependencies]
dev = [
    "jsonschema==4.23.0",
    "pytest==8.3.3",
    "ruff==0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
