[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slopguard"
version = "0.1.0"
description = "A Python-only PyPI package risk scanner MVP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["packaging>=23.2,<27"]

[dependency-groups]
dev = [
    "jsonschema==4.23.0",
    "pre-commit==4.7.0",
    "pytest==8.3.3",
    "ruff==0.17.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slopguard = ["py.typed", "schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]
