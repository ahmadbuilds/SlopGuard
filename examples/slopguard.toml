# Copy this file to slopguard.toml. Each value is the default.
version = 1

[policy]
# Library policy defaults to warning without blocking.
mode = "warn"
# Scores at or above this value produce a warning.
warn_threshold = 40
# Scores at or above this value can block when mode is "block".
block_threshold = 80
# Unknown registry results warn by default; "pass" removes that floor.
on_unknown = "warn"

[output]
# Maximum number of GitHub workflow annotations to emit (0 disables annotations).
max_annotations = 10
# Maximum number of block and warn findings to include in the job summary.
max_findings_in_summary = 50
# Maximum number of unknown-registry results to list near the top of the summary.
max_unverified_in_summary = 10
# Maximum characters rendered for each report-derived field in the summary.
max_field_characters = 1000
# Request deadline for the optional sticky pull-request comment.
comment_timeout_seconds = 10
# Maximum number of comment pages to inspect before stopping.
max_comment_pages = 10

[registry]
# Maximum duration for one HTTP request, including DNS, TLS and body reads.
timeout_seconds = 3.0
# Additional attempts after retryable HTTP or transport failures.
max_retries = 1
# Initial exponential retry delay in seconds.
backoff_seconds = 0.1
# Upper bound for each retry delay in seconds.
max_backoff_seconds = 0.5
# Maximum concurrent PyPI project metadata lookups.
max_concurrency = 8
# Maximum PyPI lookups in one scan; remaining candidates stay unknown and warn.
max_lookups = 500

[git]
# Maximum history depth fetched to find a common ancestor in a shallow checkout.
fetch_depth = 1000

[scoring.severity]
# Lower bound for low severity.
low = 20
# Lower bound for medium severity.
medium = 40
# Lower bound for high severity.
high = 60
# Lower bound for critical severity.
critical = 80

[scoring.weights]
# Points for a PyPI not-found result.
not_found = 60
# Maximum points before distance and rank scaling.
lookalike = 35
# Points for a package first released within the configured age window.
new_package = 25
# Points for a package with very few release versions.
few_releases = 10
# Points for an existing package without source links.
missing_source = 10

[scoring.signals]
# Age window in days for the new-package signal.
new_package_days = 30
# Release count at or below which the few-releases signal applies.
few_releases_max = 1
# Distance and multiplier pairs for edit matches.
distance_factors = [[1, 1.0], [2, 0.5]]
# Multiplier for names differing only by hyphen separators.
separator_factor = 1.0
# Ranks up to this value receive full strength.
full_strength_rank = 100
# Rank multiplier for packages at or above full strength.
full_rank_factor = 1.0
# Minimum rank multiplier at the end of the configured popularity window.
min_rank_factor = 0.3

[similarity]
# Compare against this many entries from the popularity snapshot.
top_n = 5000
# Skip dependency names shorter than this length.
min_length = 4
# Name length thresholds paired with their maximum edit distances.
max_distance_by_length = [[4, 1], [8, 2]]
# Keep at most this many look-alike names per dependency.
max_matches = 3

# Example exception. Prefer a short expiry and explain why it is needed.
# [[allowlist]]
# name = "internal-package"
# reason = "Approved internal dependency until its public release is available."
# expires = 2027-01-31
