name: SlopGuard

on:
  pull_request:

permissions:
  contents: read
  # To enable sticky PR comments, also grant:
  # pull-requests: write

jobs:
  slopguard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ahmadbuilds/SlopGuard@v1
        with:
          fail-on-block: "true"
          # Opt in only after granting pull-requests: write above.
          # comment: "true"
